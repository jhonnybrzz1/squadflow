# ARQUIVADO (spec 011 / R-01, 2026-07-17): configuração de deploy público OBSOLETA.
# O produto é pessoal, single-user e local-first; o deploy Render foi descontinuado
# (deploy-render.yml removido em 2026-07-12). Este arquivo NÃO é fonte operacional.
#
services:
  - type: web
    name: aichatflow
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      # === Node Configuration ===
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'

      # === Database Configuration ===
      - key: DATABASE_URL
        sync: false
      - key: STORAGE
        value: db

      # === Session Configuration ===
      - key: SESSION_SECRET
        generateValue: true
      # === AI API Keys ===
      - key: OPENAI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # === OpenRouter Configuration ===
      - key: OPENROUTER_SITE_URL
        value: https://aichatflow.onrender.com
      - key: OPENROUTER_APP_NAME
        value: AiChatFlow1
      - key: OPENROUTER_MODEL_PRIMARY
        value: inclusionai/ring-2.6-1t:free
      - key: OPENROUTER_MODEL_FALLBACK
        value: inclusionai/ling-2.6-flash

      # === Model Routing Configuration ===
      - key: ROUTING_ECONOMIC_MODEL
        value: deepseek/deepseek-v4-pro
      - key: ROUTING_SAFE_MODEL
        value: deepseek/deepseek-v4-pro
      - key: CODE_MODEL
        value: codestral-latest
      - key: MISTRAL_MODEL
        value: mistral-medium-3.5

      # === OpenAI Model Configuration ===
      - key: OPENAI_MODEL_DEFAULT
        value: mistral-medium-3.5
      - key: OPENAI_MODEL_FAST
        value: mistral-medium-3.5
      - key: OPENAI_MODEL_CAPABLE
        value: inclusionai/ring-2.6-1t:free
      - key: OPENAI_MODEL_TECHNICAL
        value: codestral-latest

      # === Document Generation Model (PM/PRD) ===
      - key: PRD_GENERATION_MODEL
        value: mimo-v2.5-pro

      # === Xiaomi MiMo (native key) — pro-tier primary for PM/PO/Tech Lead ===
      # XIAOMI_API_KEY must be set as a secret in the Render dashboard (not here).
      - key: XIAOMI_BASE_URL
        value: https://token-plan-sgp.xiaomimimo.com/v1
      - key: XIAOMI_MODEL_PRO
        value: mimo-v2.5-pro

      # === Embedding Configuration ===
      - key: EMBEDDING_PROVIDER
        value: auto
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-large

      # === AI Cache & Optimization ===
      - key: AI_RESPONSE_CACHE_ENABLED
        value: 'true'
      - key: AI_RESPONSE_CACHE_MAX_ENTRIES
        value: '250'
      - key: AI_RESPONSE_CACHE_TTL_MS
        value: '1800000'
      - key: AI_USAGE_MAX_RECORDS
        value: '1000'
      - key: EVOLVING_CONTEXT_TTL_MS
        value: '3600000'
      - key: EVOLVING_CONTEXT_MAX_ENTRIES
        value: '100'

      # === Rerank Configuration ===
      - key: RERANK_ENABLED
        value: 'true'
      - key: RERANK_MODEL
        value: cohere/rerank-v3.5
      - key: RERANK_TIMEOUT_MS
        value: '5000'
      - key: RERANK_COST_PER_SEARCH_USD
        value: '0.001'

      # === Observability (OpenTelemetry) ===
      # Set OTEL_EXPORTER_OTLP_ENDPOINT if you have a tracing backend (Jaeger, SigNoz)
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: TRACE_EXPORT_BATCH_SIZE
        value: '20'
      - key: TRACE_EXPORT_FLUSH_INTERVAL
        value: '5000'

      # === GitHub Integration (Optional) ===
      - key: GITHUB_ACCESS_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
